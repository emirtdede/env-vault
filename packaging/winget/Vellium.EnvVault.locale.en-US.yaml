ShortDescription: Encrypted, local-first .env and secret manager for Windows.
Description: Env Vault stores, edits and exports .env files in a local encrypted vault independent of project folders. It uses Argon2id and AES-256-GCM, ships a 73-language interface, four icon packs, optional serverless cloud sync and native Windows tray, hotkey and jump list integration. The core works fully offline with no account, telemetry or remote API.
